# Stage 3b models. Auditor fix (Audit 12): removed earlier duplicate alternate entries for claude-sonnet-5.5 and
# gemini-3.8-flash (8000-token alternates); the Stage-3b entries (16000 tokens) are the only definitions now.
roles:
  frontier: gpt-5.6-sol
  nonoa: deepseek-v4-pro
  cheap: qwen3.8-flash
models:
- name: gpt-5.6-sol
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-5.6-sol
  temperature: 0.7
  max_tokens: 8000
  send_seed: true
  extra_body:
    usage:
      include: true
    reasoning:
      effort: medium
  price_in_per_mtok: 2.0
  price_out_per_mtok: 10.0
  expected_output_tokens: 2500
  transport_retries: 6
- name: deepseek-v4-pro
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: deepseek/deepseek-v4-pro-0813
  temperature: 0.7
  max_tokens: 16000
  extra_body:
    usage:
      include: true
    provider:
      order:
      - Relace
      allow_fallbacks: false
  price_in_per_mtok: 0.85
  price_out_per_mtok: 5.0
  expected_output_tokens: 2500
  transport_retries: 6
- name: qwen3.8-flash
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: qwen/qwen3.8-flash
  temperature: 0.7
  max_tokens: 16000
  extra_body:
    usage:
      include: true
  price_in_per_mtok: 0.15
  price_out_per_mtok: 0.47
  expected_output_tokens: 1500
  transport_retries: 6
- name: openai-direct-example
  provider: openai_compat
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-5.6-sol
  max_tokens_field: max_completion_tokens
  max_tokens: 8000
  price_in_per_mtok: 2.0
  price_out_per_mtok: 10.0
- name: anthropic-direct-example
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY
  model: claude-sonnet-5-5
  temperature: 0.7
  max_tokens: 4000
  price_in_per_mtok: 2.0
  price_out_per_mtok: 10.0
- name: deepseek-v4.1-flash
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: deepseek/deepseek-v4.1-flash
  temperature: 0.7
  max_tokens: 16000
  transport_retries: 6
  extra_body:
    usage:
      include: true
  price_in_per_mtok: 0.05
  price_out_per_mtok: 1.32
- name: gemini-3.8-flash
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: google/gemini-3.8-flash
  temperature: 0.7
  max_tokens: 16000
  send_seed: false   # S3B-A1: Google rejects seeds > INT32 (HTTP 400)
  transport_retries: 6
  extra_body:
    usage:
      include: true
  price_in_per_mtok: 0.75
  price_out_per_mtok: 3.75
